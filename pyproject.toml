[project]
name = "lode"
version = "0.1.0"
description = "AI-powered production incident root-cause analysis platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "asyncmy>=0.2.10",
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Kafka producers may use Snappy compression; install aiokafka's official
    # codec extra so consumers can decode those batches in every runtime.
    "aiokafka[snappy]>=0.12.0",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    "prometheus-client>=0.21.0",
    "clickhouse-connect>=0.8.0",
    "httpcore>=1.0.7,<2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "sqlglot==30.17.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
