services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lode"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      # Single-node, no auth — development only.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "yes"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # In-compose services reach Postgres by its service name.
      LODE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lode
      LODE_SECRET_KEY: ${LODE_SECRET_KEY:-change-me-in-production}
      LODE_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LODE_JWT_TTL_SECONDS: "86400"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    # Same image as the API, but runs the Kafka consumer instead of uvicorn.
    command: ["python", "-m", "lode.consumer.main"]
    environment:
      LODE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lode
      LODE_SECRET_KEY: ${LODE_SECRET_KEY:-change-me-in-production}
      LODE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LODE_JWT_TTL_SECONDS: "86400"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      # Browser-facing; baked into the bundle at build time. The browser talks to
      # the backend through the host-published port 8000.
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
