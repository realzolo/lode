# Copy this file to docker-compose.yml before starting the local stack.
# Keep generated project resources namespaced as lode-* even when Compose is
# invoked from a checkout whose directory name differs.
name: lode

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lode"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9094"
    environment:
      # Single-node, no auth — development only.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "yes"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # In-compose services reach Postgres by its service name.
      LODE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lode
      LODE_MASTER_KEY: ${LODE_MASTER_KEY:?set LODE_MASTER_KEY}
      LODE_KAFKA_BOOTSTRAP_SERVERS: ${LODE_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      LODE_KAFKA_SECURITY_PROTOCOL: ${LODE_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      LODE_KAFKA_SASL_MECHANISM: ${LODE_KAFKA_SASL_MECHANISM:-PLAIN}
      LODE_KAFKA_SASL_USERNAME: ${LODE_KAFKA_SASL_USERNAME:-}
      LODE_KAFKA_SASL_PASSWORD: ${LODE_KAFKA_SASL_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    # Same image as the API, but runs the Kafka consumer instead of uvicorn.
    command: ["python", "-m", "lode.consumer.main"]
    environment:
      LODE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lode
      LODE_MASTER_KEY: ${LODE_MASTER_KEY:?set LODE_MASTER_KEY}
      LODE_KAFKA_BOOTSTRAP_SERVERS: ${LODE_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      LODE_KAFKA_SECURITY_PROTOCOL: ${LODE_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      LODE_KAFKA_SASL_MECHANISM: ${LODE_KAFKA_SASL_MECHANISM:-PLAIN}
      LODE_KAFKA_SASL_USERNAME: ${LODE_KAFKA_SASL_USERNAME:-}
      LODE_KAFKA_SASL_PASSWORD: ${LODE_KAFKA_SASL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # Durable investigation executor. The consumer only *queues* jobs; this worker
  # *claims* (SKIP LOCKED) and runs them, so a crash loses no work.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "lode.worker.main"]
    environment:
      LODE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lode
      LODE_MASTER_KEY: ${LODE_MASTER_KEY:?set LODE_MASTER_KEY}
      LODE_COMMAND_RUNNER_URL: http://command-runner:8080
      LODE_COMMAND_RUNNER_KEY: ${LODE_COMMAND_RUNNER_KEY:?set LODE_COMMAND_RUNNER_KEY}
      LODE_WORKER_CONCURRENCY: ${LODE_WORKER_CONCURRENCY:-5}
      LODE_KAFKA_BOOTSTRAP_SERVERS: ${LODE_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      LODE_KAFKA_SECURITY_PROTOCOL: ${LODE_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      LODE_KAFKA_SASL_MECHANISM: ${LODE_KAFKA_SASL_MECHANISM:-PLAIN}
      LODE_KAFKA_SASL_USERNAME: ${LODE_KAFKA_SASL_USERNAME:-}
      LODE_KAFKA_SASL_PASSWORD: ${LODE_KAFKA_SASL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
      command-runner:
        condition: service_healthy
    networks:
      - default
      - runner-control
    restart: unless-stopped

  command-runner:
    build:
      context: .
      dockerfile: Dockerfile.command-runner
    environment:
      LODE_COMMAND_RUNNER_KEY: ${LODE_COMMAND_RUNNER_KEY:?set LODE_COMMAND_RUNNER_KEY}
    networks:
      - runner-control
    read_only: true
    volumes:
      - ./runner_worksets:/worksets:ro
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/command-runner-seccomp.json
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      # Browser-facing; baked into the bundle at build time. The browser talks to
      # the backend through the host-published port 8000.
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:

networks:
  runner-control:
    internal: true
